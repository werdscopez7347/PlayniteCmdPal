name: Diagnose CI (temporary)

# TEMPORARY: exists only to surface the failing step and failing test names as check
# annotations while the normal job log is not retrievable. Delete this workflow once the
# underlying failure is fixed.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose shared CI checks
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run checks and annotate failures
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -File ./scripts/ci.ps1 > ci-diagnostic.log 2>&1
          status=$?

          # Keep the tail on the console in case logs are retrievable.
          tail -n 200 ci-diagnostic.log

          # Surface step markers, errors, and test failures as annotations. Only names and
          # messages are reported; nothing is copied from a private data source.
          grep -aE '^(==>|ERROR|FAILED)|error (CS|MSB|NETSDK|NU)[0-9]+|Failed!|Passed!|^[[:space:]]*Failed [A-Za-z]|Assert\.|Expected:|Actual:' ci-diagnostic.log \
            | head -n 120 \
            | while IFS= read -r line; do
                echo "::error::$line"
              done

          exit $status
