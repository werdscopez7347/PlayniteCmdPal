name: Diagnose CI (temporary)

# TEMPORARY: surfaces per-project test totals and any failing test names as check
# annotations, because job logs are not retrievable in the authoring environment.
# Delete this workflow once the counts have been read.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose shared CI checks
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run lifecycle tests repeatedly
        shell: pwsh
        run: |
          dotnet restore .\PlayniteCmdPal.sln
          dotnet build .\PlayniteCmdPal.sln --configuration Release --no-restore
          $failed = 0
          for ($i = 1; $i -le 10; $i++) {
            $log = "lifecycle-$i.log"
            dotnet test .\PlayniteCmdPal.Playnite.Tests\PlayniteCmdPal.Playnite.Tests.csproj `
              --configuration Release --no-build --no-restore `
              --filter "FullyQualifiedName~CatalogExportCoordinatorLifecycleTests" > $log 2>&1
            $code = $LASTEXITCODE
            $summary = (Select-String -Path $log -Pattern '^(Passed|Failed)!' | Select-Object -First 1).Line
            Write-Host "lifecycle iteration ${i}: exit $code :: $summary"
            if ($code -ne 0) {
              $failed++
              Select-String -Path $log -Pattern '^\s*Failed [A-Za-z]' | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            }
          }
          Write-Host "lifecycle failed iterations: $failed of 10"
          exit $failed

      - name: Capture test totals
        shell: bash
        if: always()
        run: |
          set +e
          pwsh -NoProfile -File ./scripts/ci.ps1 > ci-diagnostic.log 2>&1
          status=$?
          tail -n 60 ci-diagnostic.log
          grep -aE '^(==>|ERROR|FAILED)|Failed!|Passed!|^\s*Failed [A-Za-z]' ci-diagnostic.log \
            | head -n 80 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
